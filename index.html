<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KhetNaap — Field Measurement Tool</title>

  <!-- Leaflet & Leaflet.draw CSS (Free CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <div>
      <h1 data-i18n="appTitle">KhetNaap</h1>
      <span class="subtitle" data-i18n="subtitle">Tap field corners on satellite map</span>
    </div>
    <div class="header-controls">
      <button id="lang-btn" type="button" class="btn-lang">हिंदी</button>
      <button id="locate-btn" type="button" class="btn-locate" title="Find My Location" data-i18n="myLocation">📍 My Location</button>
    </div>
  </header>

  <div class="search-bar">
    <input
      type="text"
      id="place-search-input"
      placeholder="Search village, town, or area (e.g., Mhow, Dhar, Indore)..."
      data-i18n-placeholder="searchPlaceholder"
      autocomplete="off"
    />
    <button id="place-search-btn" type="button" class="btn-search" data-i18n="searchBtn">Search</button>
  </div>

  <main id="map"></main>

  <section class="dashboard">
    <!-- Walk-the-Boundary Live GPS Controls -->
    <div class="gps-walk-bar">
      <button id="walk-toggle-btn" type="button" class="btn-walk" data-i18n="startWalk">🚶 Start GPS Walk</button>
      <button id="walk-finish-btn" type="button" class="btn-walk-finish" disabled data-i18n="finishWalk">✓ Finish Plot</button>
      <span id="walk-status" class="walk-status">GPS Walk: Idle (0 pts)</span>
    </div>

    <div class="metrics-grid">
      <div class="metric-card primary">
        <span class="label" data-i18n="acres">Acres</span>
        <strong id="area-acres">0.00</strong>
      </div>
      <div class="metric-card">
        <span class="label" data-i18n="hectares">Hectares</span>
        <strong id="area-hectares">0.00</strong>
      </div>
      <div class="metric-card">
        <span class="label" data-i18n="bigha">Bigha (MP/Std)</span>
        <strong id="area-bigha">0.00</strong>
      </div>
      <div class="metric-card">
        <span class="label" data-i18n="sqm">Sq. Meters</span>
        <strong id="area-sqm">0</strong>
      </div>
    </div>

    <div class="perimeter-row">
      <span><span data-i18n="perimeterLabel">Boundary Perimeter:</span> <strong id="perimeter-m">0 m</strong></span>
      <select id="bigha-preset" title="Select Bigha Standard">
        <option value="2529.29">1 Bigha = 27,225 sq ft (MP/UP/Raj)</option>
        <option value="1618.74">1 Bigha = 17,424 sq ft (Gujarat)</option>
        <option value="1337.80">1 Bigha = 14,400 sq ft (Bengal/Assam)</option>
      </select>
    </div>

    <div class="actions">
      <input
        type="text"
        id="plot-name"
        placeholder="Plot name (e.g., North Wheat Khet)"
        data-i18n-placeholder="plotPlaceholder"
      />
      <button id="save-btn" type="button" class="btn-save" data-i18n="savePlot">Save Plot</button>
      <button id="share-btn" type="button" class="btn-share" data-i18n="sharePlot">Share Link</button>
      <button id="clear-btn" type="button" class="btn-clear" data-i18n="clearPlot">Clear</button>
    </div>

    <div id="saved-list" class="saved-list"></div>
    <p class="disclaimer" data-i18n="disclaimer">*Approximate satellite measurement for farming & planning—not a legal revenue survey.</p>
  </section>

  <!-- Leaflet, Leaflet.draw & Turf.js (Free CDN) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
